<svg width="900" height="506" viewBox="0 0 900 506" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="900" height="506" fill="#0f1e35"/>
  <!-- Subtle grid -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="0" y1="126" x2="900" y2="126"/><line x1="0" y1="252" x2="900" y2="252"/>
    <line x1="0" y1="378" x2="900" y2="378"/>
    <line x1="225" y1="0" x2="225" y2="506"/><line x1="450" y1="0" x2="450" y2="506"/>
    <line x1="675" y1="0" x2="675" y2="506"/>
  </g>

  <!-- Sentiment bars background -->
  <rect x="60" y="60" width="780" height="386" rx="12" fill="#162032"/>

  <!-- Title bar -->
  <rect x="60" y="60" width="780" height="52" rx="12" fill="#1e3050"/>
  <rect x="60" y="96" width="780" height="16" fill="#1e3050"/>
  <text x="90" y="92" font-family="monospace" font-size="15" fill="#7dd3fc" font-weight="bold">GPT Sentiment Analyzer</text>
  <text x="620" y="92" font-family="monospace" font-size="12" fill="#4ade80">● API Connected</text>

  <!-- Input box -->
  <rect x="80" y="130" width="740" height="44" rx="6" fill="#0f1e35" stroke="#2563a8" stroke-width="1.5"/>
  <text x="100" y="157" font-family="monospace" font-size="13" fill="#94a3b8">"The new climate policy shows remarkable progress toward..."</text>

  <!-- Sentiment result bars -->
  <!-- Positive -->
  <text x="80" y="210" font-family="monospace" font-size="12" fill="#94a3b8">Positive</text>
  <rect x="160" y="196" width="560" height="20" rx="4" fill="#0f1e35"/>
  <rect x="160" y="196" width="434" height="20" rx="4" fill="#1d4ed8"/>
  <rect x="160" y="196" width="434" height="20" rx="4" fill="url(#posGrad)"/>
  <text x="604" y="210" font-family="monospace" font-size="12" fill="#60a5fa" font-weight="bold">77%</text>

  <!-- Neutral -->
  <text x="80" y="250" font-family="monospace" font-size="12" fill="#94a3b8">Neutral</text>
  <rect x="160" y="236" width="560" height="20" rx="4" fill="#0f1e35"/>
  <rect x="160" y="236" width="112" height="20" rx="4" fill="#1e4a3a"/>
  <text x="284" y="250" font-family="monospace" font-size="12" fill="#34d399" font-weight="bold">20%</text>

  <!-- Negative -->
  <text x="80" y="290" font-family="monospace" font-size="12" fill="#94a3b8">Negative</text>
  <rect x="160" y="276" width="560" height="20" rx="4" fill="#0f1e35"/>
  <rect x="160" y="276" width="17" height="20" rx="4" fill="#4a1a1a"/>
  <text x="190" y="290" font-family="monospace" font-size="12" fill="#f87171" font-weight="bold">3%</text>

  <!-- Token stream -->
  <text x="80" y="336" font-family="monospace" font-size="11" fill="#475569">Token analysis:</text>
  <rect x="80" y="346" width="90" height="26" rx="4" fill="#1d3a6a"/>
  <text x="125" y="363" font-family="monospace" font-size="11" fill="#93c5fd" text-anchor="middle">climate</text>
  <rect x="178" y="346" width="60" height="26" rx="4" fill="#1d3a6a"/>
  <text x="208" y="363" font-family="monospace" font-size="11" fill="#93c5fd" text-anchor="middle">policy</text>
  <rect x="246" y="346" width="100" height="26" rx="4" fill="#14532d"/>
  <text x="296" y="363" font-family="monospace" font-size="11" fill="#86efac" text-anchor="middle">remarkable</text>
  <rect x="354" y="346" width="80" height="26" rx="4" fill="#14532d"/>
  <text x="394" y="363" font-family="monospace" font-size="11" fill="#86efac" text-anchor="middle">progress</text>
  <rect x="442" y="346" width="66" height="26" rx="4" fill="#1e293b"/>
  <text x="475" y="363" font-family="monospace" font-size="11" fill="#64748b" text-anchor="middle">toward</text>

  <!-- GPT label -->
  <rect x="680" y="346" width="140" height="26" rx="4" fill="#2d1b69"/>
  <text x="750" y="363" font-family="monospace" font-size="11" fill="#c4b5fd" text-anchor="middle">GPT-4o · 142 tokens</text>

  <!-- Bottom status -->
  <rect x="80" y="400" width="740" height="30" rx="4" fill="#0f1e35"/>
  <text x="100" y="419" font-family="monospace" font-size="11" fill="#475569">Model: gpt-4o  |  Confidence: 0.94  |  Latency: 312ms  |  Texts processed: 1,847</text>

  <defs>
    <linearGradient id="posGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
</svg>
